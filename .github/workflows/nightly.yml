name: Nightly

on:
  push:
    branches: [ main ]
    paths:
    - 'src/**'
    - 'build.js'
    - 'package.json'
    - 'package-lock.json'
    - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: npm

    - name: Build
      run: |
        npm ci
        node build.js

    - name: Syntax check
      run: for f in $(find dist/app -name '*.js'); do node --check "$f"; done

    - uses: actions/upload-artifact@v4
      with:
        name: built-asar
        path: dist/app.asar
        retention-days: 7


  test-linux:
    name: Test Linux ${{ matrix.channel }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [ stable, canary ]

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: built-asar

    - name: Download Discord and install asar
      run: |
        wget -q "https://discord.com/api/download/${{ matrix.channel }}?platform=linux&format=tar.gz" -O discord.tar.gz
        tar xf discord.tar.gz
        DIR=$(ls -d Discord*/ | head -1)
        echo "DIR=$DIR" >> $GITHUB_ENV
        cp app.asar "$DIR/resources/app.asar"
        # workaround https://github.com/electron/electron/issues/42510
        sudo chown root "$DIR/chrome-sandbox"
        sudo chmod 4755 "$DIR/chrome-sandbox"

    - name: Check Discord starts through asar
      timeout-minutes: 4
      run: |
        EXE=$(find "$DIR" -maxdepth 1 -type f -name 'Discord*' -perm -u+x | head -1)
        ASAR_SMOKE=1 xvfb-run -e /dev/stdout "$EXE" --enable-logging 2>&1 | tee run.log | grep -m1 "ASAR_SMOKE_OK"


  release:
    name: Release
    needs: [ build, test-linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 10

    - uses: actions/download-artifact@v4
      with:
        name: built-asar

    - name: Publish to build branch
      run: |
        # asar self-updates from raw.githubusercontent.com/rottenvia/asar/build/app.asar
        SHA=$(git rev-parse --short=7 HEAD)
        mkdir publish && cp app.asar publish/ && cd publish
        printf '# asar build\n\nLatest app.asar, built from %s by CI. See the main branch for source.\n' "$SHA" > README.md
        git init -q -b build
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A && git commit -q -m "Build $SHA"
        git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build

    - name: Publish nightly release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES="Nightly build of asar from $(git rev-parse --short=7 HEAD).

        Latest changes:
        $(git log -5 --format='- %s')

        Install: fully quit Discord, rename resources/app.asar to app.asar.backup, then put this app.asar in its place."
        gh release delete nightly --cleanup-tag -y || true
        gh release create nightly app.asar --title "Nightly" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
